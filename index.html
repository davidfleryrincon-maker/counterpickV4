<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MLBB Counter Master v4</title>
  
  <!-- Configuración de Favicon y PWA Icon -->
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <meta name="theme-color" content="#0b1120">

  <style>
    :root {
      --bg: #0b1120;
      --card: #1e293b;
      --card-inner: #0f172a;
      --accent: #38bdf8;
      --accent-dark: #0284c7;
      --gold: #eab308;
      --text: #f8fafc;
      --muted: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 15px;
      min-height: 100vh;
    }

    .container {
      background-color: var(--card);
      padding: 20px;
      border-radius: 16px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .app-logo {
      width: 80px;
      height: 80px;
      border-radius: 16px;
      object-fit: cover;
      border: 2px solid var(--accent);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }

    h2 {
      color: var(--accent);
      margin-top: 10px;
      font-size: 1.4rem;
    }

    h3 {
      color: var(--accent);
      margin-bottom: 12px;
      font-size: 1.1rem;
    }

    .step-card {
      background-color: var(--card-inner);
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 15px;
      border: 1px solid #334155;
    }

    label {
      font-weight: 600;
      display: block;
      margin-top: 10px;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    input, select, button {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: var(--bg);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent);
    }

    .input-group {
      display: flex;
      gap: 8px;
    }

    .input-group button {
      width: 35%;
      margin: 0;
    }

    button {
      background: linear-gradient(135deg, var(--accent-dark) 0%, #075985 100%);
      font-weight: bold;
      cursor: pointer;
      border: none;
      margin-top: 12px;
      transition: all 0.2s ease;
      color: white;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-reset {
      background: linear-gradient(135deg, #475569 0%, #334155 100%);
      margin-top: 15px;
    }

    .hero-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
      min-height: 28px;
    }

    .tag {
      background: #1e293b;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tag span {
      cursor: pointer;
      color: var(--danger);
      font-weight: bold;
    }

    .block-title {
      font-weight: bold;
      color: var(--gold);
      margin-bottom: 8px;
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
    }

    .item-badge {
      background: #1e293b;
      border-left: 3px solid var(--accent);
      padding: 10px;
      margin: 6px 0;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    .fuzzy-notice {
      font-size: 0.8rem;
      color: var(--gold);
      margin-top: 4px;
      font-style: italic;
    }

    .empty-msg {
      color: var(--muted);
      font-size: 0.85rem;
      font-style: italic;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- ENCABEZADO Y LOGO -->
  <div class="header">
    <img src="logo.png" alt="Logo" class="app-logo" onerror="this.style.display='none'">
    <h2>MLBB Counter Master v3</h2>
  </div>

  <!-- PASO 1: POOL PERSONAL -->
  <div class="step-card">
    <h3 id="t-step1">1. Configurar tu Pool de Héroes</h3>
    <label for="poolLinea" id="t-selectLane">Seleccionar Línea:</label>
    <select id="poolLinea" onchange="mostrarPoolActual()">
      <option value="exp">EXP Lane</option>
      <option value="mid">MID Lane</option>
      <option value="gold">GOLD Lane</option>
      <option value="jungle">JUNGLE</option>
      <option value="roam">ROAM</option>
    </select>
    
    <label id="t-addHero">Agregar héroe a esta línea:</label>
    <div class="input-group">
      <input type="text" id="nuevoHeroePool" placeholder="Ej: Paquito, Chou...">
      <button onclick="agregarHeroePool()" id="t-btnAdd">Agregar</button>
    </div>

    <div class="hero-tags" id="poolTags"></div>
  </div>

  <!-- PASO 2: BÚSQUEDA DE COUNTER -->
  <div class="step-card">
    <h3 id="t-step2">2. Buscar Counter de Línea</h3>
    <label for="partidaLinea" id="t-yourLane">Línea que jugarás:</label>
    <select id="partidaLinea">
      <option value="exp">EXP Lane</option>
      <option value="mid">MID Lane</option>
      <option value="gold">GOLD Lane</option>
      <option value="jungle">JUNGLE</option>
      <option value="roam">ROAM</option>
    </select>

    <label for="enemigoPick" id="t-enemyPick">Pick Enemigo en tu línea:</label>
    <input type="text" id="enemigoPick" placeholder="Ej: Uranus, Gusion, Brody...">

    <button onclick="buscarCounter()" id="t-btnAnalyze">Analizar Matchup</button>
  </div>

  <!-- PASO 3: PANEL DE RESULTADOS -->
  <div id="resultadosCounter" style="display:none;">
    <div class="step-card">
      <div class="block-title" id="t-block1Title">🥇 BLOQUE 1: Mejor Opción de tu Pool</div>
      <div id="poolResult"></div>
    </div>

    <div class="step-card">
      <div class="block-title" style="color:var(--accent);" id="t-block2Title">🌍 BLOQUE 2: Mejor Opción General (MLBB Hub)</div>
      <div id="generalResult"></div>
    </div>

    <!-- BOTÓN DE REINICIO -->
    <button class="btn-reset" onclick="reiniciarBusqueda()" id="t-btnReset">🔄 Analizar Nueva Partida</button>
  </div>
</div>

<script>

  "Bruno", "Clint", "Rafaela", "Eudora", "Zilong", "Fanny", "Layla", "Minotaur", "Lolita", "Hayabusa",
  "Freya", "Gord", "Natalia", "Kagura", "Chou", "Sun", "Alpha", "Ruby", "Yi Sun-shin", "Moscov",
  "Johnson", "Cyclops", "Estes", "Hilda", "Aurora", "Lapu-Lapu", "Vexana", "Harley", "Irithel", "Grock",
  "Argus", "Odette", "Lancelot", "Diggie", "Hylos", "Zhask", "Helcurt", "Pharsa", "Lesley", "Jawhead",
  "Angela", "Gusion", "Valir", "Martis", "Uranus", "Hanabi", "Chang'e", "Kaja", "Selena", "Aldous",
  "Claude", "Vale", "Leomord", "Lunox", "Hanzo", "Belerick", "Kimmy", "Thamuz", "Harith", "Minsitthar",
  "Badang", "Khufra", "Granger", "Guinevere", "Esmeralda", "Terizla", "X.Borg", "Ling", "Dyrroth", "Lylia",
  "Baxia", "Masha", "Wanwan", "Silvanna", "Cecilion", "Carmilla", "Atlas", "Popol and Kupa", "Yu Zhong", "Luo Yi",
  "Benedetta", "Khaleed", "Barats", "Brody", "Yve", "Mathilda", "Paquito", "Gloo", "Phoveus", "Natan",
  "Aulus", "Aamon", "Valentina", "Edith", "Yin", "Melissa", "Xavier", "Julian", "Fredrinn", "Joy",
  "Novaria", "Arlott", "Ixia", "Nolan", "Cici", "Chip", "Zhuxin", "Lukas", "Suyu", "Kaela", "Calea"
];

// MAPA DINÁMICO DE COUNTERS DE MLBB HUB POR CATEGORÍAS/HÉROES
const GENERAL_COUNTERS = {
  // Tanques / Regen
  regen: {
    heroes: ["Uranus", "Esmeralda", "Edith", "Yu Zhong", "Ruby", "Thamuz", "Terizla", "Hylos", "Gloo", "Belerick", "Alice"],
    counters: [
      { name: "Dyrroth / Baxia", desc: "Reducción masiva de defensas físicas e inhibición pasiva de la regeneración/escudos." },
      { name: "Lunox / Karrie", desc: "Daño verdadero y porcentual basado en la vida máxima que ignora la durabilidad." },
      { name: "Dominance Ice (Ítem Core) + Minsitthar", desc: "Corta la regeneración al 50% y anula sus habilidades de desplazamiento." }
    ]
  },
  // Asesinos Hipermovilidad
  mobile: {
    heroes: ["Fanny", "Ling", "Gusion", "Hayabusa", "Joy", "Nolan", "Lancelot", "Benedetta", "Helcurt", "Harley", "Aamon"],
    counters: [
      { name: "Kaja / Franco", desc: "Supresión ineludible que cancela instantáneamente cualquier desplazamiento o combo." },
      { name: "Khufra / Phoveus", desc: "Bloquea los dashes continuamente y los convierte en daño/escudos propios." },
      { name: "Saber / Eudora", desc: "Control instantáneo y explosión de daño de un solo objetivo antes de que reaccionen." }
    ]
  },
  // Tiradores de Rango / Dps
  marksman: {

    counters: [
      { name: "Natalia / Helcurt", desc: "Invisibilidad, silencio y burst táctico para eliminar la retaguardia enemiga." },
      { name: "Lolita / Chou", desc: "Bloqueo total de proyectiles con escudo o iniciación directa con CC inmune." },
      { name: "Belerick / Blade Armor", desc: "Devuelve el daño de los ataques básicos infligidos y aplica provocación." }
    ]
  },
  // Magos / Control de Masas
  mages: {
    heroes: ["Zhuxin", "Novaria", "Yve", "Pharsa", "Cecilion", "Luo Yi", "Valir", "Xavier", "Vexana", "Gord", "Kagura", "Aurora"],
    counters: [
      { name: "Chou / Joy", desc: "Inmunidad al control de masas y alta movilidad para flanquear la retaguardia." },
      { name: "Helcurt / Hayabusa", desc: "Cierre de distancia rápido y silencio inmediato en fase de combos." },
      { name: "Athena's Shield (Ítem Core)", desc: "Reducción drástica del daño mágico explosivo continuo." }
    ]
  },
  // Combatientes / Sustained Damage (Cici, Kaela, etc.)
  fighters: {
    heroes: ["Cici", "Kaela", "Calea", "Paquito", "Chou", "Alpha", "Martis", "Freya", "Lapu-Lapu", "Arlott", "Lukas", "Suyu", "Badang", "Sun", "Argus", "Zilong", "Aulus"],
    counters: [
      { name: "Valir / Akai", desc: "Efectos de 'Kiting' y repulsión constante que impiden el combate a corta distancia." },
      { name: "Thamuz / Terizla", desc: "Dominio de intercambios en early game con mayor sustento e inmunidad parcial." },
      { name: "Silvanna / Minsitthar", desc: "Inmovilización de objetivo único en área reducida eliminando su escape." }
    ]
  }
};

// DICCIONARIOS DE IDIOMA
const i18n = {
  es: {
    step1: "1. Configurar tu Pool de Héroes",
    selectLane: "Seleccionar Línea:",
    addHero: "Agregar héroe a esta línea:",
    btnAdd: "Agregar",
    step2: "2. Buscar Counter de Línea",
    yourLane: "Línea que jugarás:",
    enemyPick: "Pick Enemigo en tu línea:",
    btnAnalyze: "Analizar Matchup",
    block1Title: "🥇 BLOQUE 1: Mejor Opción de tu Pool",
    block2Title: "🌍 BLOQUE 2: Mejor Opción General (MLBB Hub)",
    btnReset: "🔄 Analizar Nueva Partida",
    emptyPool: "Tu pool está vacío para esta línea. Agrega héroes arriba.",
    noMatchInPool: "Ningún héroe en tu pool actual genera ventaja directa contra ",
    recommendPool: "Recomendación basada en sinergia estándar de tu pool.",
    fuzzyFound: "Interpretado como: ",
    enterEnemy: "Por favor, ingresa el nombre del héroe enemigo."
  },
  en: {
    step1: "1. Configure Your Hero Pool",
    selectLane: "Select Lane:",
    addHero: "Add hero to this lane:",
    btnAdd: "Add",
    step2: "2. Search Lane Counter",
    yourLane: "Lane you will play:",
    enemyPick: "Enemy Pick in your lane:",
    btnAnalyze: "Analyze Matchup",
    block1Title: "🥇 BLOCK 1: Best Option from Your Pool",
    block2Title: "🌍 BLOCK 2: Best General Option (MLBB Hub)",
    btnReset: "🔄 Analyze New Matchup",
    emptyPool: "Your pool is empty for this lane. Add heroes above.",
    noMatchInPool: "No heroes in your current pool hard-counter ",
    recommendPool: "Recommendation based on standard pool synergy.",
    fuzzyFound: "Interpreted as: ",
    enterEnemy: "Please enter the enemy hero name."
  }
};

const lang = window.navigator.language.startsWith('es') ? 'es' : 'en';
const txt = i18n[lang];

// INICIALIZACIÓN DE TEXTOS EN INTERFAZ
document.getElementById('t-step1').innerText = txt.step1;
document.getElementById('t-selectLane').innerText = txt.selectLane;
document.getElementById('t-addHero').innerText = txt.addHero;
document.getElementById('t-btnAdd').innerText = txt.btnAdd;
document.getElementById('t-step2').innerText = txt.step2;
document.getElementById('t-yourLane').innerText = txt.yourLane;
document.getElementById('t-enemyPick').innerText = txt.enemyPick;
document.getElementById('t-btnAnalyze').innerText = txt.btnAnalyze;
document.getElementById('t-block1Title').innerText = txt.block1Title;
document.getElementById('t-block2Title').innerText = txt.block2Title;
document.getElementById('t-btnReset').innerText = txt.btnReset;

// POOL EN LOCALSTORAGE
let userPool = JSON.parse(localStorage.getItem('mlbb_user_pool')) || {
  exp: [], mid: [], gold: [], jungle: [], roam: []
};

function guardarPool() {
  localStorage.setItem('mlbb_user_pool', JSON.stringify(userPool));
}

function mostrarPoolActual() {
  const linea = document.getElementById('poolLinea').value;
  const container = document.getElementById('poolTags');
  container.innerHTML = "";
  
  const heroes = userPool[linea] || [];
  if (heroes.length === 0) {
    container.innerHTML = `<span class="empty-msg">${txt.emptyPool}</span>`;
    return;
  }

  heroes.forEach((h, index) => {
    container.innerHTML += `<div class="tag">${h} <span onclick="eliminarHeroePool('${linea}', ${index})">&times;</span></div>`;
  });
}

function agregarHeroePool() {
  const linea = document.getElementById('poolLinea').value;
  const input = document.getElementById('nuevoHeroePool');
  const nombreRaw = input.value.trim();
  
  if (nombreRaw) {
    const nombreIdentificado = identificarHeroe(nombreRaw);
    if (!userPool[linea]) userPool[linea] = [];
    userPool[linea].push(nombreIdentificado);
    guardarPool();
    mostrarPoolActual();
    input.value = "";
  }
}

function eliminarHeroePool(linea, index) {
  userPool[linea].splice(index, 1);
  guardarPool();
  mostrarPoolActual();
}

// ALGORITMO DE LEVENSHTEIN (FUZZY SEARCH)
function levenshtein(a, b) {
  const tmp = [];
  let i, j;
  for (i = 0; i <= a.length; i++) tmp[i] = [i];
  for (j = 0; j <= b.length; j++) tmp[0][j] = j;

  for (i = 1; i <= a.length; i++) {
    for (j = 1; j <= b.length; j++) {
      tmp[i][j] = a[i - 1] === b[j - 1] 
        ? tmp[i - 1][j - 1] 
        : Math.min(tmp[i - 1][j - 1] + 1, Math.min(tmp[i][j - 1] + 1, tmp[i - 1][j] + 1));
    }
  }
  return tmp[a.length][b.length];
}

function identificarHeroe(entrada) {
  const limpia = entrada.toLowerCase().trim();
  let mejorCoincidencia = entrada;
  let menorDistancia = Infinity;

  HERO_DATABASE.forEach(heroe => {
    const distancia = levenshtein(limpia, heroe.toLowerCase());
    if (distancia < menorDistancia) {
      menorDistancia = distancia;
      mejorCoincidencia = heroe;
    }
  });

  return menorDistancia <= 3 ? mejorCoincidencia : entrada;
}

// OBTENER COUNTERS GENERALES DINÁMICOS
function obtenerCountersGenerales(enemigo) {
  const enemigoLow = enemigo.toLowerCase();

  for (const cat in GENERAL_COUNTERS) {
    if (GENERAL_COUNTERS[cat].heroes.some(h => h.toLowerCase() === enemigoLow)) {
      return GENERAL_COUNTERS[cat].counters;
    }
  }

  // Fallback por defecto si no pertenece a un arquetipo específico
  return [
    { name: "Kaja / Franco", desc: "Control de masas ineludible para anular la iniciación rival." },
    { name: "Dyrroth / Alpha", desc: "Gran daño temprano y reducción de defensas en duelos directos." },
    { name: "Valir / Diggie", desc: "Desenganche continuo para neutralizar el control enemigo." }
  ];
}

// LÓGICA DE RECOMENDACIÓN MLBB
function buscarCounter() {
  const linea = document.getElementById('partidaLinea').value;
  const inputEnemigo = document.getElementById('enemigoPick').value.trim();
  
  if (!inputEnemigo) { 
    alert(txt.enterEnemy); 
    return; 
  }

  const enemigoFinal = identificarHeroe(inputEnemigo);
  const pool = userPool[linea] || [];
  
  // Bloque 1 (Pool del usuario)
  let bestPoolHero = pool[0] || null;
  let razonPool = txt.recommendPool;
  let fuzzyNotice = (enemigoFinal.toLowerCase() !== inputEnemigo.toLowerCase()) 
    ? `<div class="fuzzy-notice">${txt.fuzzyFound} <strong>${enemigoFinal}</strong></div>` 
    : "";

  if (pool.length === 0) {
    document.getElementById('poolResult').innerHTML = `<p class="empty-msg">${txt.emptyPool}</p>`;
  } else {
    const enemigoLow = enemigoFinal.toLowerCase();
    
    if (['uranus', 'esmeralda', 'edith', 'phoveus'].some(e => enemigoLow.includes(e)) && pool.includes("Esmeralda")) {
      bestPoolHero = "Esmeralda";
      razonPool = "Absorbe escudos enemigos y anula la regeneración del rival en fase de líneas.";
    } else if (['terizla', 'thamuz', 'ruby', 'alpha', 'yu zhong', 'kaela', 'cici'].some(e => enemigoLow.includes(e)) && pool.includes("Cici")) {
      bestPoolHero = "Cici";
      razonPool = "Kitea a distancia infligiendo daño por % de vida máxima evitando intercambios directos.";
    } else if (['fanny', 'ling', 'gusion', 'hayabusa', 'joy'].some(e => enemigoLow.includes(e)) && pool.includes("Kaja")) {
      bestPoolHero = "Kaja";
      razonPool = "Su supresión ineludible detiene la movilidad del rival instantáneamente.";
    } else if (!bestPoolHero) {
      bestPoolHero = pool[0];
    }

    document.getElementById('poolResult').innerHTML = `
      ${fuzzyNotice}
      <strong style="color:var(--success); font-size:1.2rem;">${bestPoolHero}</strong>
      <p style="margin-top:4px; font-size:0.9rem; color:var(--text);">${razonPool}</p>
    `;
  }

  // Bloque 2 (Dinámico según el Pick enemigo introducido)
  const topCounters = obtenerCountersGenerales(enemigoFinal);
  
  let htmlBloque2 = "";
  topCounters.forEach((c, i) => {
    htmlBloque2 += `<div class="item-badge">${i + 1}. <strong>${c.name}</strong> - ${c.desc}</div>`;
  });

  document.getElementById('generalResult').innerHTML = htmlBloque2;
  document.getElementById('resultadosCounter').style.display = "block";
}

// REINICIAR BÚSQUEDA
function reiniciarBusqueda() {
  document.getElementById('enemigoPick').value = "";
  document.getElementById('resultadosCounter').style.display = "none";
}

// Inicializar interfaz
mostrarPoolActual();
</script>

</body>
</html>
