<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MLBB Counter Master V4</title>
  
  <!-- Configuración de Favicon y PWA Icon -->
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <meta name="theme-color" content="#0b1120">

  <style>

      --bg: #0b1120;
      --card: #1e293b;
      --card-inner: #0f172a;
      --accent: #38bdf8;
      --accent-dark: #0284c7;
      --gold: #eab308;
      --text: #f8fafc;
      --muted: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 15px;
      min-height: 100vh;
    }

    .container {
      background-color: var(--card);
      padding: 20px;
      border-radius: 16px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .app-logo {
      width: 80px;
      height: 80px;
      border-radius: 16px;
      object-fit: cover;
      border: 2px solid var(--accent);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }

    h2 {
      color: var(--accent);
      margin-top: 10px;
      font-size: 1.4rem;
    }

    .app-subtitle {
      color: var(--muted);
      font-size: 0.88rem;
      margin-top: 6px;
      line-height: 1.3;
    }

    h3 {
      color: var(--accent);
      margin-bottom: 12px;
      font-size: 1.1rem;
    }

    .step-card {
      background-color: var(--card-inner);
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 15px;
      border: 1px solid #334155;
    }

    label {
      font-weight: 600;
      display: block;
      margin-top: 10px;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    input, select, button {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: var(--bg);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent);
    }

    .input-group {
      display: flex;
      gap: 8px;
    }

    .input-group button {
      width: 35%;
      margin: 0;
    }

    button {
      background: linear-gradient(135deg, var(--accent-dark) 0%, #075985 100%);
      font-weight: bold;
      cursor: pointer;
      border: none;
      margin-top: 12px;
      transition: all 0.2s ease;
      color: white;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-reset {
      background: linear-gradient(135deg, #475569 0%, #334155 100%);
      margin-top: 15px;
    }

    .hero-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
      min-height: 28px;
    }

    .tag {
      background: #1e293b;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tag span {
      cursor: pointer;
      color: var(--danger);
      font-weight: bold;
    }

    .block-title {
      font-weight: bold;
      color: var(--gold);
      margin-bottom: 8px;
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
    }

    .item-badge {
      background: #1e293b;
      border-left: 3px solid var(--accent);

      margin: 6px 0;

      font-size: 0.9rem;
    }

      font-style: italic;
    }

    }

</head>

      <option value="gold">GOLD Lane</option>

    <button onclick="buscarCounter()" id="t-btnAnalyze">Analizar Matchup</button>
  </div>

  <!-- PASO 3: PANEL DE RESULTADOS -->

const lang = window.navigator.language.startsWith('es') ? 'es' : 'en';
const txt = i18n[lang];

// INICIALIZACIÓN DE TEXTOS EN INTERFAZ
document.getElementById('t-step1').innerText = txt.step1;
document.getElementById('t-selectLane').innerText = txt.selectLane;
document.getElementById('t-addHero').innerText = txt.addHero;
document.getElementById('t-btnAdd').innerText = txt.btnAdd;
document.getElementById('t-step2').innerText = txt.step2;

document.getElementById('t-btnReset').innerText = txt.btnReset;

// POOL EN LOCALSTORAGE
let userPool = JSON.parse(localStorage.getItem('mlbb_user_pool')) || {
  exp: [], mid: [], gold: [], jungle: [], roam: []
};

function guardarPool() {
  localStorage.setItem('mlbb_user_pool', JSON.stringify(userPool));
}

function mostrarPoolActual() {
  const linea = document.getElementById('poolLinea').value;
  const container = document.getElementById('poolTags');
  container.innerHTML = "";
  
  const heroes = userPool[linea] || [];
  if (heroes.length === 0) {
    container.innerHTML = `<span class="empty-msg">${txt.emptyPool}</span>`;
    return;
  }

  heroes.forEach((h, index) => {
    container.innerHTML += `<div class="tag">${h} <span onclick="eliminarHeroePool('${linea}', ${index})">&times;</span></div>`;
  });
}

function agregarHeroePool() {
  const linea = document.getElementById('poolLinea').value;
  const input = document.getElementById('nuevoHeroePool');
  const nombreRaw = input.value.trim();
  
  if (nombreRaw) {
    const nombreIdentificado = identificarHeroe(nombreRaw);
    if (!userPool[linea]) userPool[linea] = [];
    userPool[linea].push(nombreIdentificado);
    guardarPool();
    mostrarPoolActual();
    input.value = "";
  }
}

function eliminarHeroePool(linea, index) {
  userPool[linea].splice(index, 1);
  guardarPool();
  mostrarPoolActual();
}

// ALGORITMO DE LEVENSHTEIN (FUZZY SEARCH)
function levenshtein(a, b) {
  const tmp = [];
  let i, j;
  for (i = 0; i <= a.length; i++) tmp[i] = [i];
  for (j = 0; j <= b.length; j++) tmp[0][j] = j;

  for (i = 1; i <= a.length; i++) {
    for (j = 1; j <= b.length; j++) {
      tmp[i][j] = a[i - 1] === b[j - 1] 
        ? tmp[i - 1][j - 1] 
        : Math.min(tmp[i - 1][j - 1] + 1, Math.min(tmp[i][j - 1] + 1, tmp[i - 1][j] + 1));
    }
  }
  return tmp[a.length][b.length];
}

function identificarHeroe(entrada) {
  const limpia = entrada.toLowerCase().trim();
  let mejorCoincidencia = entrada;
  let menorDistancia = Infinity;

  HERO_DATABASE.forEach(heroe => {
    const distancia = levenshtein(limpia, heroe.toLowerCase());
    if (distancia < menorDistancia) {
      menorDistancia = distancia;
      mejorCoincidencia = heroe;
    }
  });

  return menorDistancia <= 3 ? mejorCoincidencia : entrada;
}

// OBTENER COUNTERS EXCLUSIVOS DE LA LÍNEA SELECCIONADA
function obtenerCountersGeneralesPorLinea(linea, enemigo) {
  const enemigoLow = enemigo.toLowerCase();
  const laneData = COUNTERS_BY_LANE[linea] || COUNTERS_BY_LANE.exp;

  if (laneData.regen && laneData.regen.enemies.some(e => e === enemigoLow)) {
    return laneData.regen.counters;
  }
  if (laneData.mobile && laneData.mobile.enemies.some(e => e === enemigoLow)) {
    return laneData.mobile.counters;
  }
  if (laneData.tanky && laneData.tanky.enemies.some(e => e === enemigoLow)) {
    return laneData.tanky.counters;
  }

  return laneData.default;
}

// LÓGICA DE RECOMENDACIÓN MLBB
function buscarCounter() {
  const linea = document.getElementById('partidaLinea').value;
  const inputEnemigo = document.getElementById('enemigoPick').value.trim();
  
  if (!inputEnemigo) { 
    alert(txt.enterEnemy); 
    return; 
  }

  const enemigoFinal = identificarHeroe(inputEnemigo);
  const pool = userPool[linea] || [];
  
  // Bloque 1 (Pool del usuario)
  let bestPoolHero = pool[0] || null;
  let razonPool = txt.recommendPool;
  let fuzzyNotice = (enemigoFinal.toLowerCase() !== inputEnemigo.toLowerCase()) 
    ? `<div class="fuzzy-notice">${txt.fuzzyFound} <strong>${enemigoFinal}</strong></div>` 
    : "";

  if (pool.length === 0) {
    document.getElementById('poolResult').innerHTML = `<p class="empty-msg">${txt.emptyPool}</p>`;
  } else {
    const enemigoLow = enemigoFinal.toLowerCase();
    
    if (['uranus', 'esmeralda', 'edith', 'phoveus'].some(e => enemigoLow.includes(e)) && pool.includes("Esmeralda")) {
      bestPoolHero = "Esmeralda";
      razonPool = "Absorbe escudos enemigos y anula la regeneración del rival en fase de líneas.";
    } else if (['terizla', 'thamuz', 'ruby', 'alpha', 'yu zhong', 'kaela', 'cici'].some(e => enemigoLow.includes(e)) && pool.includes("Cici")) {
      bestPoolHero = "Cici";
      razonPool = "Kitea a distancia infligiendo daño por % de vida máxima evitando intercambios directos.";
    } else if (['fanny', 'ling', 'gusion', 'hayabusa', 'joy'].some(e => enemigoLow.includes(e)) && pool.includes("Kaja")) {
      bestPoolHero = "Kaja";
      razonPool = "Su supresión ineludible detiene la movilidad del rival instantáneamente.";
    } else {
      bestPoolHero = pool[0];
    }

    document.getElementById('poolResult').innerHTML = `
      ${fuzzyNotice}
      <strong style="color:var(--success); font-size:1.2rem;">${bestPoolHero}</strong>
      <p style="margin-top:4px; font-size:0.9rem; color:var(--text);">${razonPool}</p>
    `;
  }

  // Bloque 2 (Filtrado estricto por la línea actual)
  const topCounters = obtenerCountersGeneralesPorLinea(linea, enemigoFinal);
  
  let htmlBloque2 = "";
  topCounters.forEach((c, i) => {
    htmlBloque2 += `<div class="item-badge">${i + 1}. <strong>${c.name}</strong> - ${c.desc}</div>`;
  });

  document.getElementById('generalResult').innerHTML = htmlBloque2;
  document.getElementById('resultadosCounter').style.display = "block";
}

// REINICIAR BÚSQUEDA
function reiniciarBusqueda() {
  document.getElementById('enemigoPick').value = "";
  document.getElementById('resultadosCounter').style.display = "none";
}
