<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MLBB Counter Master V4</title>
  
  <!-- Configuración de Favicon y PWA Icon -->
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <meta name="theme-color" content="#0b1120">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
  <!-- ENCABEZADO Y LOGO -->
  <div class="header">
    <img src="logo.png" alt="Logo" class="app-logo" onerror="this.style.display='none'">
    <h2>MLBB Counter Master V4</h2>
    <p class="app-subtitle">Encuentra el counter ideal para dominar tu línea.</p>
  </div>

  <!-- PASO 1: POOL PERSONAL -->
  <div class="step-card">
    <h3 id="t-step1">1. Configurar tu Pool de Héroes</h3>
    <label for="poolLinea" id="t-selectLane">Seleccionar Línea:</label>
    <select id="poolLinea">
      <option value="exp">EXP Lane</option>
      <option value="mid">MID Lane</option>
      <option value="gold">GOLD Lane</option>
      <option value="jungle">JUNGLE</option>
      <option value="roam">ROAM</option>
    </select>
    
    <label id="t-addHero">Agregar héroe a esta línea:</label>
    <div class="input-group">
      <input type="text" id="nuevoHeroePool" placeholder="Ej: Paquito, Chou...">
      <button id="t-btnAdd">Agregar</button>
    </div>

    <div class="hero-tags" id="poolTags"></div>
  </div>

  <!-- PASO 2: BÚSQUEDA DE COUNTER -->
  <div class="step-card">
    <h3 id="t-step2">2. Buscar Counter de Línea</h3>
    <label for="partidaLinea" id="t-yourLane">Línea que jugarás:</label>
    <select id="partidaLinea">
      <option value="exp">EXP Lane</option>
      <option value="mid">MID Lane</option>
      <option value="gold">GOLD Lane</option>
      <option value="jungle">JUNGLE</option>
      <option value="roam">ROAM</option>
    </select>

    <label for="enemigoPick" id="t-enemyPick">Pick Enemigo en tu línea:</label>
    <input type="text" id="enemigoPick" placeholder="Ej: Uranus, Kaela, Brody...">

    <button id="t-btnAnalyze">Analizar Matchup</button>
  </div>

  <!-- PASO 3: PANEL DE RESULTADOS -->
  <div id="resultadosCounter" style="display:none;">
    <div class="step-card">
      <div class="block-title" id="t-block1Title">🥇 TU MEJOR OPCIÓN</div>
      <div class="block-subtitle" id="t-block1Sub">Según los héroes que sabes usar en esta línea</div>
      <div id="poolResult"></div>
    </div>

    <div class="step-card">
      <div class="block-title" style="color:var(--accent);" id="t-block2Title">🌍 OPCIÓN ESTADÍSTICAMENTE FAVORABLE</div>
      <div class="block-subtitle" id="t-block2Sub">Según los datos del meta</div>
      <div id="generalResult"></div>
    </div>

    <!-- BOTÓN DE REINICIO -->
    <button class="btn-reset" id="t-btnReset">🔄 Analizar Nueva Partida</button>
  </div>
</div>

<script type="module" src="js/app.js"></script>

</body>
</html>
